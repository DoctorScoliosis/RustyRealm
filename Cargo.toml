[package]
name = "rustyrealm"
version = "0.1.0"
edition = "2021"
description = "A cross-platform revival of Windows-exclusive Batch game Final Realm"

[dependencies]
crossterm = "0.27"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"